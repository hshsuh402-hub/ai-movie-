<!doctype html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Open Rocky 😈</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:Arial,sans-serif}
#start{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:#111}
#open{border:0;border-radius:15px;padding:18px 30px;font-size:22px;font-weight:700}
#screen{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#000}
#vid{width:100%;height:100%;object-fit:contain}
#lock{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;text-align:center;background:rgba(0,0,0,.94);font-size:30px;font-weight:700;pointer-events:auto}
#lock small{font-size:18px}
#soundBtn{position:fixed;right:15px;bottom:15px;z-index:30;display:none;border:0;border-radius:12px;padding:12px 16px;font-size:16px;font-weight:700}
</style>
</head>
<body>
<div id="start"><button id="open">Open Rocky 😈</button></div>
<div id="screen">
  <video id="vid" playsinline preload="auto">
    <source src="3335.mp4" type="video/mp4">
  </video>
  <audio id="aud" preload="auto">
    <source src="ReelAudio-33695.mp3" type="audio/mpeg">
  </audio>
</div>
<div id="lock">😱 TOUCH LOCKED!<br><small id="count">5 seconds...</small></div>
<button id="soundBtn">🔊 Sound ON</button>
<script>
const start=document.getElementById('start');
const screen=document.getElementById('screen');
const open=document.getElementById('open');
const vid=document.getElementById('vid');
const aud=document.getElementById('aud');
const lock=document.getElementById('lock');
const count=document.getElementById('count');
const soundBtn=document.getElementById('soundBtn');

open.addEventListener('click',async()=>{
  start.style.display='none';
  screen.style.display='flex';
  vid.muted=true;
  vid.play().catch(()=>{});
  aud.volume=1;
  try{await aud.play();}catch(e){soundBtn.style.display='block';}
  lock.style.display='flex';
  let s=5;
  count.textContent=s+' seconds...';
  const timer=setInterval(()=>{
    s--;
    if(s<=0){clearInterval(timer);lock.style.display='none';}
    else count.textContent=s+' seconds...';
  },1000);
});

soundBtn.addEventListener('click',async()=>{
  try{await aud.play();soundBtn.style.display='none';}
  catch(e){alert('Phone ka media volume check karo.');}
});
</script>
</body>
</html>

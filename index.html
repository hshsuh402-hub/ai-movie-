<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Open Rocky 😈</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#000;color:#fff}
#start{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#111;z-index:5}
button{border:0;border-radius:14px;padding:18px 30px;font-size:22px;font-weight:700}
#screen{display:none;position:fixed;inset:0;background:#000;z-index:10;align-items:center;justify-content:center}
video{width:100%;height:100%;object-fit:contain}
#lock{display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:20;align-items:center;justify-content:center;text-align:center;font-size:30px;font-weight:700}
</style>
</head>
<body>
<div id="start"><button id="open">Open Rocky 😈</button></div>
<div id="screen"><video id="vid" controls playsinline>
<source src="3335.mp4" type="video/mp4">
</video></div>
<div id="lock">😱 TOUCH LOCKED!<br><small style="font-size:18px">5 seconds...</small></div>

<script>
const start=document.getElementById('start');
const screen=document.getElementById('screen');
const vid=document.getElementById('vid');
const lock=document.getElementById('lock');

document.getElementById('open').addEventListener('click',()=>{
  start.style.display='none';
  screen.style.display='flex';
  vid.play().catch(()=>{});
  lock.style.display='flex';

  // Safe prank: only the webpage ignores touch temporarily.
  setTimeout(()=>{ lock.style.display='none'; },5000);
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Surprise 😱</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
    }

    #prank {
      display: none;
    }

    button {
      padding: 16px 25px;
      margin: 10px;
      border: 0;
      border-radius: 12px;
      font-size: 18px;
      cursor: pointer;
    }

    #start {
      background: #ffcc00;
    }

    #stop {
      background: #ff4444;
      color: white;
    }

    #prank h1 {
      font-size: 42px;
    }
  </style>
</head>

<body>

  <div id="startScreen">
    <h1>🎁 Ek Surprise Hai!</h1>
    <p>Button dabao 😄</p>
    <button id="start" onclick="startPrank()">Open 😎</button>
  </div>

  <div id="prank">
    <h1>😱 AAAAAAA!</h1>
    <p>😂 PRANK HO GAYA!</p>
    <button id="stop" onclick="stopSound()">🔇 Stop</button>
  </div>

  <audio id="scream" preload="auto">
    <source src="ReelAudio-33695.mp3" type="audio/mpeg">
  </audio>

  <script>
    function startPrank() {
      document.getElementById("startScreen").style.display = "none";
      document.getElementById("prank").style.display = "block";

      const sound = document.getElementById("scream");
      sound.currentTime = 0;
      sound.play();
    }

    function stopSound() {
      const sound = document.getElementById("scream");
      sound.pause();
      sound.currentTime = 0;
    }
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Surprise 😎</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
    }

    #prank {
      display: none;
    }

    button {
      padding: 16px 25px;
      margin: 10px;
      border: 0;
      border-radius: 12px;
      font-size: 18px;
      cursor: pointer;
    }

    #start {
      background: #ffc000;
    }

    #stop {
      background: #ff4444;
      color: white;
    }

    #prank h1 {
      font-size: 42px;
    }
  </style>
</head>

<body>

  <!-- START SCREEN -->
  <div id="startScreen">
    <h1>😎 Rocky</h1>
    <p>Ek Surprise Hai 🎁</p>

    <button id="start" onclick="startPrank()">
      Open Rocky 😎
    </button>
  </div>


  <!-- PRANK SCREEN -->
  <div id="prank">
    <h1>😱 AAAAAAA!</h1>
    <p>😂 PRANK HO GAYA! 🤣</p>

    <button id="stop" onclick="stopSound()">
      🔇 Stop
    </button>
  </div>


  <!-- AUDIO -->
  <audio id="scream" preload="auto">
    <source src="ReelAudio-33695.mp3" type="audio/mpeg">
  </audio>


  <script>
    const sound = document.getElementById("scream");

    function startPrank() {

      // Start screen hide
      document.getElementById("startScreen").style.display = "none";

      // Prank screen show
      document.getElementById("prank").style.display = "block";

      // Audio start
      sound.currentTime = 0;

      sound.play().catch(function(error) {
        console.log("Audio play blocked:", error);
      });
    }


    function stopSound() {

      // Audio stop
      sound.pause();
      sound.currentTime = 0;
    }
  </script>

</body>
</html>

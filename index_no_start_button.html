<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Surprise 😱</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
    }

    #prank {
      display: none;
    }

    button {
      padding: 16px 25px;
      margin: 10px;
      border: 0;
      border-radius: 12px;
      font-size: 18px;
      cursor: pointer;
    }

    #start {
      background: #ffcc00;
    }

    #stop {
      background: #ff4444;
      color: white;
    }

    #prank h1 {
      font-size: 42px;
    }
  </style>
</head>

<body>



  <div id="prank">
    <h1>😱 AAAAAAA!</h1>
    <p>😂 PRANK HO GAYA!</p>
    <button id="stop" onclick="stopSound()">🔇 Stop</button>
  </div>

  <audio id="scream" preload="auto">
   <source src="ReelAudio-33695.mp3" type="audio/mpeg"> 
  </audio>

  <script>
    const sound = document.getElementById("scream");

    function stopSound() {
      sound.pause();
      sound.currentTime = 0;
    }

    // Page khulte hi prank screen aur audio start karne ki koshish.
    window.addEventListener("load", function() {
      document.getElementById("prank").style.display = "block";

      sound.currentTime = 0;
      sound.play().catch(() => {});
    });

    // Agar browser autoplay block kare, pehle tap par audio start ho jayega.
    document.addEventListener("click", function() {
      if (sound.paused) {
        sound.play().catch(() => {});
      }
    }, { once: true });
  </script>

</body>
</html>
